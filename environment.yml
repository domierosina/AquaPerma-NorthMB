name: aquaperma
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy == 1.24.4
  - pandas == 2.0.3
  - rasterio == 1.3.11
  - geopandas == 0.6.1
  - matplotlib == 3.3.4
  - openeo == 0.46.0

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-image
  - matplotlib
  - seaborn

  # Geospatial stack (conda-forge recommended)
  - gdal
  - rasterio
  - geopandas
  - shapely
  - fiona
  - pyproj
  - rtree
  - rioxarray
  - folium

  # Jupyter ecosystem
  - jupyter
  - ipykernel

  # HTTP + utilities
  - requests
  - tqdm
  - click

  # Testing
  - pytest
  - pytest-cov

  # General Python utilities
  - pip

  - pip:
      - boto3