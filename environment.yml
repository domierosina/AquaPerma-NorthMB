name: aquaperma
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-image
  - matplotlib
  - seaborn

  # Geospatial stack (conda-forge recommended)
  - gdal
  - rasterio
  - geopandas
  - shapely
  - fiona
  - pyproj
  - rtree
  - rioxarray

  # Jupyter ecosystem
  - jupyter
  - ipykernel

  # HTTP + utilities
  - requests
  - tqdm
  - click

  # Testing
  - pytest
  - pytest-cov

  # General Python utilities
  - pip

  - pip:
      - boto3
